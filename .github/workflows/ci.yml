name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Runs only the hermetic tests: the retail/NUS end-to-end tests are #[ignore]d,
      # and the fixture-gated tests are also #[ignore]d (they self-skip when .dev/ is
      # absent, as it is on a clean checkout, but are marked #[ignore] so CI can't report
      # them as passing with zero assertions).
      # Deliberately debug-mode (not --release): overflow checks are only active there, and
      # this suite is fast enough that the slower binary doesn't matter (see CLAUDE.md).
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace declares rust-version = "1.88" (Cargo.toml); verify it still builds on
      # exactly that toolchain, since the `test` job above only proves `stable` works.
      - name: Install Rust 1.88 toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked
